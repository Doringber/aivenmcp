[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aiven-rag-mcp"
version = "0.1.0"
description = "MCP server for retrieval-augmented answers over the Aiven documentation (pgvector + local embeddings)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "fastembed==0.9.0",
    "psycopg[binary,pool]==3.3.6",
    "pgvector==0.5.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.0",
    "mypy==1.18.2",
]

[project.scripts]
rag-mcp = "aiven_rag_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiven_rag_mcp = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a PostgreSQL + pgvector database (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# House style: Optional[X] over X | None, and TypeVar over PEP 695 generics.
ignore = ["UP007", "UP045", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
