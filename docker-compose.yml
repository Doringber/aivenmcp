name: aiven-rag-mcp

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    container_name: aiven-rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Parallel HNSW builds keep the graph in /dev/shm; Docker's 64 MB default makes them fail.
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    build: .
    image: aiven-rag-mcp:latest
    container_name: aiven-rag-mcp
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}@db:5432/rag
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
    volumes:
      # Host folder for `ingest(path="/data/...")`. Read-only: the server never writes there.
      - ./data:/data:ro
    ports:
      # Streamable HTTP endpoint (http://localhost:8000/mcp), bound to localhost only.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
